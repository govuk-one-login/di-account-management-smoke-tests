default_install_hook_types: [commit-msg, pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        name: Git Lint
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: no-commit-to-branch

  - repo: https://github.com/Yelp/detect-secrets
    rev: 5e141933554a0b74e7341841f318be21e895339c # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        stages: [pre-commit]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: e3eebf65325ccc992422292cb7a4baee967cf815 # pragma: allowlist secret
    hooks:
      - id: zizmor
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        exclude: .*
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: prettier
        name: Prettier
        entry: npm run check-pretty
        language: system
        exclude: .*
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: check-types
        name: Check types
        entry: npm run check-types
        language: system
        exclude: .*
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: sam-validate
        name: SAM validate
        entry: npm run sam-validate
        language: system
        exclude: .*
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: knip
        name: Knip
        entry: npm run knip
        language: system
        exclude: .*
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
